{% extends "base.html" %}
{% block title %}New Announcement - EduManage{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-slate-800 mb-6">Post Announcement</h1>
<form method="post" class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 space-y-4 max-w-xl">
    {% csrf_token %}
    <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Title</label>
        <input type="text" name="title" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
    </div>
    <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Message</label>
        <textarea name="body" rows="4" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"></textarea>
    </div>
    <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Audience</label>
        <select name="audience" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
            <option value="all">Everyone</option>
            <option value="teachers">Teachers Only</option>
            <option value="students">Students Only</option>
            <option value="parents">Parents Only</option>
        </select>
    </div>
    <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-5 py-2.5 rounded-lg">Post</button>
</form>
{% endblock %}
